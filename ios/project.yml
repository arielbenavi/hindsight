# Source of truth for the Xcode project. Hindsight.xcodeproj is generated
# from this file by XcodeGen and is NOT committed. After editing this file,
# run `xcodegen` in ios/ to regenerate the project.
name: Hindsight
options:
  bundleIdPrefix: com.reutrabin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: HE6MENN8S6
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Hindsight:
    type: application
    platform: iOS
    sources:
      - Hindsight
      # Seed export shared with the rest of the repo; bundled so the app has
      # real saved-post data to build against.
      - path: ../data/ig-saved-posts-seed.md
        buildPhase: resources
      # Reut's Instagram export (the saved-posts files of a Meta data download),
      # for the "Use Reut's export (dev)" button in the Meta import sheet.
      - path: ../data/ig-reut-export
        buildPhase: resources
      # Data-contract fixtures, one per tester (data/fixtures/README.md).
      - path: ../data/fixtures
        buildPhase: resources
        includes:
          - "*.hindsight.json"
          - "*.matches.json"
    entitlements:
      # Apple's server-side models (docs/merge-plan.md → AI requirements).
      # Managed entitlement, granted to Reut's team. Personal Team builds drop it:
      # scripts/device.sh does that when HINDSIGHT_TEAM is set.
      path: Hindsight/Hindsight.entitlements
      properties:
        com.apple.developer.private-cloud-compute: true
    info:
      # Merged with the generated Info.plist keys below. Dark launch screen,
      # so the app doesn't flash white before the first frame.
      path: Hindsight/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Hindsight
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reutrabin.hindsight
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Hindsight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Hindsight shows the places you saved near where you are."

  HindsightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HindsightTests
    dependencies:
      - target: Hindsight
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Hindsight:
    build:
      targets:
        Hindsight: all
        HindsightTests: [test]
    test:
      targets:
        - HindsightTests
